name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...

  windows:
    runs-on: windows-latest
    env:
      MUSIC_OPS_STRICT: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install ffmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Install FDK-AAC library from fre:ac
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "freac.zip"
          $folder = Join-Path $env:RUNNER_TEMP "freac"
          Invoke-WebRequest -Uri "https://github.com/enzo1982/freac/releases/download/v1.1.7/freac-1.1.7-windows-x64.zip" -OutFile $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($hash -ne "EF45665AAE6C1C0EB4C0ECD8ECC6BED24F02F3CDDF6CFD72D8E5C9BC858BF110") { throw "fre:ac checksum mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath $folder
          $library = Get-ChildItem -Path $folder -Recurse -Filter "FDK-AAC.dll" | Select-Object -First 1
          Add-Content $env:GITHUB_ENV "MUSIC_OPS_ENCODER_FDK_LIBRARY=$($library.FullName)"
      - name: Vet
        run: for tags in "" integration e2e eval live; do go vet -tags "$tags" ./... || exit 1; done
      - name: Coverage gate
        run: |
          mkdir -p cover
          go test -tags integration -cover -coverpkg=./... ./... -args -test.gocoverdir="$PWD/cover"
          MUSIC_OPS_E2E_COVERDIR="$PWD/cover" go test -tags e2e ./internal/test/e2e/
          go tool covdata textfmt -i=cover -o cover.out
          go tool cover -func=cover.out | tail -n 1
          awk 'NR > 1 && $2 > 0 && $3 == 0 { print; missed = 1 } END { exit missed }' cover.out
