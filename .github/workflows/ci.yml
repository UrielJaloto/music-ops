name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      MUSIC_OPS_STRICT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - name: Install ffmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Install FDK-AAC library from fre:ac
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "freac.zip"
          $folder = Join-Path $env:RUNNER_TEMP "freac"
          Invoke-WebRequest -Uri "https://github.com/enzo1982/freac/releases/download/v1.1.7/freac-1.1.7-windows-x64.zip" -OutFile $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($hash -ne "EF45665AAE6C1C0EB4C0ECD8ECC6BED24F02F3CDDF6CFD72D8E5C9BC858BF110") { throw "fre:ac checksum mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath $folder
          $library = Get-ChildItem -Path $folder -Recurse -Filter "FDK-AAC.dll" | Select-Object -First 1
          Add-Content $env:GITHUB_ENV "MUSIC_OPS_ENCODER_FDK_LIBRARY=$($library.FullName)"
      - name: Unit tests
        run: go test -count=1 -shuffle=on -cover ./...
      - name: Integration tests
        run: go test -count=1 -tags integration ./...
      - name: End-to-end tests
        run: go test -count=1 -tags e2e ./cmd/...
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
