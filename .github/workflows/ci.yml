name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Install Go tools
        shell: pwsh
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add gcc to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\msys64\ucrt64\bin"
      - name: Install ffmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Install FDK-AAC library from fre:ac
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "freac.zip"
          $folder = Join-Path $env:RUNNER_TEMP "freac"
          Invoke-WebRequest -Uri "https://github.com/enzo1982/freac/releases/download/v1.1.7/freac-1.1.7-windows-x64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $folder
          $library = Get-ChildItem -Path $folder -Recurse -Filter "FDK-AAC.dll" | Select-Object -First 1
          Add-Content $env:GITHUB_ENV "MUSIC_OPS_ENCODER_FDK_LIBRARY=$($library.FullName)"
      - name: Test runner tests
        shell: pwsh
        run: Invoke-Pester ./test.Tests.ps1 -CI
      - name: Suites
        shell: pwsh
        run: ./test.ps1 -Lint -Unit -Race -Integration -Cover
