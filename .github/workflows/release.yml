name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      MUSIC_OPS_STRICT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install ffmpeg
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Install FDK-AAC library from fre:ac
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "freac.zip"
          $folder = Join-Path $env:RUNNER_TEMP "freac"
          Invoke-WebRequest -Uri "https://github.com/enzo1982/freac/releases/download/v1.1.7/freac-1.1.7-windows-x64.zip" -OutFile $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($hash -ne "EF45665AAE6C1C0EB4C0ECD8ECC6BED24F02F3CDDF6CFD72D8E5C9BC858BF110") { throw "fre:ac checksum mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath $folder
          $library = Get-ChildItem -Path $folder -Recurse -Filter "FDK-AAC.dll" | Select-Object -First 1
          Add-Content $env:GITHUB_ENV "MUSIC_OPS_ENCODER_FDK_LIBRARY=$($library.FullName)"
      - name: Unit tests
        run: go test ./...
      - name: Integration tests
        run: go test -tags integration ./...
      - name: End-to-end tests
        run: go test -tags e2e ./internal/test/e2e/
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build
        shell: pwsh
        run: ./build/build.ps1 -Version $env:GITHUB_REF_NAME.TrimStart("v")
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/music-ops.exe dist/checksums.txt --title $env:GITHUB_REF_NAME --generate-notes
