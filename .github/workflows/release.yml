name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        shell: pwsh
        run: ./build/build.ps1 -Version $env:GITHUB_REF_NAME.TrimStart("v")
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/music-ops.exe dist/checksums.txt --title $env:GITHUB_REF_NAME --generate-notes
