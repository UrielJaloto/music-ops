version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gocritic
    - revive
    - errorlint
    - contextcheck
    - bodyclose
    - noctx
    - gosec
    - misspell
    - unparam
    - whitespace
    - funlen
    - cyclop
    - nestif
    - gocognit
    - nakedret
    - nilnil
    - nilerr
    - forbidigo
    - dupword
    - predeclared
    - prealloc
  settings:
    funlen:
      lines: 30
      statements: 30
    cyclop:
      max-complexity: 10
    nestif:
      min-complexity: 2
    revive:
      rules:
        - name: argument-limit
          arguments: [5]
        - name: function-result-limit
          arguments: [3]
        - name: early-return
        - name: indent-error-flow
        - name: superfluous-else
        - name: unused-parameter
        - name: confusing-naming
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    forbidigo:
      forbid:
        - pattern: ^print(ln)?$
        - pattern: ^fmt\.Print.*$
        - pattern: ^os\.Getenv$
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocognit
          - cyclop
      - path: ^(presentation|cmd)/
        text: fmt\.Print
        linters:
          - forbidigo
      - path: ^domain/track\.go$
        text: (G401|G505)
        linters:
          - gosec
      - path: ^infrastructure/process_runner(_test)?\.go$
        text: G204
        linters:
          - gosec
      - path: ^infrastructure/(fdk_library|folder_picker)_windows\.go$
        text: G103
        linters:
          - gosec
      - path: ^infrastructure/config\.go$
        text: os\.Getenv
        linters:
          - forbidigo

formatters:
  enable:
    - gofumpt
